[project]
name = "satisrag"
version = "0.1.0"
description = "Conversational RAG assistant for new Satisfactory players"
readme = "README.md"
authors = [{ name = "Alaskechufles" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.14.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modern syntax, B likely bugs,
# SIM simplifications, N naming, RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
files = ["src", "eval"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# eval/ is not part of the installed package, so tests need the repo root
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
